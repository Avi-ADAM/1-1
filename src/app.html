<!DOCTYPE html>
<html lang=%lang%>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // מניעת flash של עיצוב לא נכון
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'personal';
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);

        // עדכון CSS Variables מיד
        const themeConfigs = {
          personal: {
            '--color-primary': '#3b82f6',
            '--color-secondary': '#10b981',
            '--color-background': '#f9fafb',
            '--color-text': '#1f2937',
            '--color-card': '#ffffff',
            '--color-accent': '#8b5cf6',
            '--color-muted': '#6b7280',
            '--border-radius': '0.75rem',
            '--shadow': '0 10px 15px -3px rgba(0, 0, 0, 0.1)'
          },
          business: {
            '--color-primary': '#1f2937',
            '--color-secondary': '#374151',
            '--color-background': '#f3f4f6',
            '--color-text': '#111827',
            '--color-card': '#ffffff',
            '--color-accent': '#059669',
            '--color-muted': '#9ca3af',
            '--border-radius': '0.25rem',
            '--shadow': '0 1px 3px 0 rgba(0, 0, 0, 0.1)'
          }
        };

        const config = themeConfigs[theme];
        if (config) {
          Object.entries(config).forEach(([key, value]) => {
            document.documentElement.style.setProperty(key, value);
          });
        }
      } catch (e) {
        console.warn('Theme initialization failed:', e);
      }
    })();
  </script>
 
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">


  <meta charset="UTF-8" />

  <link rel="apple-touch-icon"
    href="https://res.cloudinary.com/love1/image/upload/v1645647192/apple-touch-icon_irclue.png">
  <link rel="manifest" href="%manifest%">
  <link rel="icon" href="/favicon.ico" />
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-status-bar-style' content='black'>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="follow, index" />
  <meta name="theme-color" content="#EEE8AA">
  <meta name="description" content="%desc%">
  <title>%title%</title>
  <meta http-equiv='content-language' content='%cl%'>
  <meta name="msvalidate.01" content="401F6E4E20E82CED795C21C85ED50935" />
  <meta name="google-site-verification" content="OBaTsyCpA22qESpUMYcqAnafQf4NxOYLICeWuudw30Y" />

  <!-- Canonical, hreflang, Open Graph, Twitter and JSON-LD for this page in
       this language — built in $lib/config/seo.js, rendered by hooks.server.js. -->
%seohead%

  %sveltekit.head%
</head>

<body>
  <div id="svelte">%sveltekit.body%</div>
</body>

</html>
